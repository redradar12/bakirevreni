<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ödeme Sonucu — Bakır Evreni</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;background:#f8f6f2;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:48px 32px;text-align:center;max-width:420px;width:100%}
.icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:#fff;font-weight:700}
.icon.ok{background:#0e8345}
.icon.fail{background:#c0392b}
h2{font-size:22px;margin-bottom:8px;color:#1a1a1a}
p{font-size:14px;color:#555;line-height:1.5;margin-bottom:20px}
.btn{display:inline-block;padding:12px 32px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;color:#fff;background:#292622;transition:background .2s}
.btn:hover{background:#a85d38}
.loading{color:#888}
.debug{font-size:11px;color:#999;margin-top:16px;border-top:1px solid #eee;padding-top:10px;text-align:left;word-break:break-all}
</style>
</head>
<body>
<div class="card" id="resultCard">
  <div class="loading" id="statusMsg">Ödeme sonucu kontrol ediliyor...</div>
  <div class="debug" id="debugInfo"></div>
</div>
<script>
(async()=>{
  const card=document.getElementById('resultCard');
  const msg=document.getElementById('statusMsg');
  const dbg=document.getElementById('debugInfo');
  function log(s){if(dbg)dbg.innerHTML+=s+'<br>'}

  const p=new URLSearchParams(location.search);
  const token=p.get('token');
  const status=p.get('status');
  log('URL:'+location.search);
  log('token:'+(token?'var':'yok')+' status:'+(status||'yok'));

  if(!token||status==='failure'){
    card.innerHTML='<div class="icon fail">✕</div><h2>Ödeme Başarısız</h2><p>İşlem tamamlanamadı. Lütfen tekrar deneyin.</p><a class="btn" href="./">Ana Sayfaya Dön</a>';
    return;
  }

  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqbXlxYWRjcXBheGxicGZuemphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjA1ODgsImV4cCI6MjEwMDgzNjU4OH0.q_UJivzLt-UPJZ90AfkSXx1fRByNtf1GMjcUmV-1HJs';
  const SB_URL='https://xjmyqadcqpaxlbpfnzja.supabase.co';

  let verified=false;
  let paymentId='';

  // Try Edge Function verification with 6s timeout
  msg.textContent='Ödeme doğrulanıyor...';
  log('Edge Function deneniyor...');
  try{
    const ctrl=new AbortController();
    const tmr=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(SB_URL+'/functions/v1/iyzico-checkout-result',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({token}),
      signal:ctrl.signal
    });
    clearTimeout(tmr);
    log('Edge Function cevap:'+r.status);
    if(r.ok){
      const j=await r.json();
      log('Edge Function data:'+JSON.stringify(j).substring(0,200));
      if(j.status==='success'){
        verified=true;
        paymentId=j.paymentId||j.conversationId||'';
        if(j.paymentStatus==='FAILURE'){
          log('iyzico FAILURE');
          card.innerHTML='<div class="icon fail">✕</div><h2>Ödeme Başarısız</h2><p>İşlem tamamlanamadı. Lütfen tekrar deneyin.</p><a class="btn" href="./">Ana Sayfaya Dön</a>';
          return;
        }
      }
    }
  }catch(e){
    log('Edge Function hata:'+(e.name||'')+' '+(e.message||'').substring(0,100));
  }

  // Get cart from sessionStorage, fallback to localStorage
  msg.textContent='Sipariş kaydediliyor...';
  let cart=[],buyer={};
  try{
    let c=sessionStorage.getItem('pendingCart');
    let b=sessionStorage.getItem('pendingBuyer');
    if(!c){c=localStorage.getItem('pendingCart');log('sessionStorage bos, localStorage denendi')}
    if(!b){b=localStorage.getItem('pendingBuyer')}
    if(c){cart=JSON.parse(c);log('cart:'+cart.length+' urun')}
    else{log('cart bos!')}
    if(b){buyer=JSON.parse(b);log('buyer:'+(buyer.name||buyer.email||'yok'))}
    else{log('buyer bos!')}
  }catch(e){log('parse hata:'+e.message)}

  if(!cart.length){
    log('Kritik: sepet verisi yok, siparis kaydedilemedi!');
    card.innerHTML='<div class="icon fail">✕</div><h2>Sipariş Hatası</h2><p>Sepet bilgisi bulunamadı. Ödemeniz alınmış olabilir, lütfen bizimle iletişime geçin.</p><a class="btn" href="./">Ana Sayfaya Dön</a>';
    return;
  }

  const items=cart.map(i=>({name:i.name,price:i.price,qty:i.qty||1}));
  let total=items.reduce((s,i)=>s+i.price*i.qty,0);
  let couponDsc=0;
  try{const cd=sessionStorage.getItem('pendingCoupon');if(cd)couponDsc=parseFloat(cd)||0}catch(e){}
  if(couponDsc)total=total*(100-couponDsc)/100;
  log('toplam:'+total.toFixed(2)+' TL');

  try{
    let orderNumber='';
    try{
      const onr=await fetch(SB_URL+'/rest/v1/rpc/get_next_order_number',{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}
      });
      if(onr.ok){orderNumber=await onr.json();log('siparis no:'+orderNumber)}
      else log('siparis no alinamadi:'+onr.status)
    }catch(e){log('siparis no hata:'+e.message)}

    const saveRes=await fetch(SB_URL+'/rest/v1/orders',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({
        order_number:orderNumber||null,
        items,total,
        customer_name:buyer.name||buyer.email||'',
        customer_email:buyer.email||'',
        customer_phone:buyer.phone||'',
        customer_address:buyer.address||'',
        customer_city:buyer.city||'',
        customer_district:buyer.district||'',
        customer_province:buyer.province||'',
        payment_id:paymentId||token||'',
        payment_status:verified?'success':'pending_verify',
        payment_method:'iyzico',
        order_status:verified?'paid':'pending',
        note:buyer.note||null
      })
    });
    log('DB kayit:'+saveRes.status);
  }catch(e){log('DB hata:'+e.message)}

  sessionStorage.removeItem('pendingCart');
  sessionStorage.removeItem('pendingBuyer');
  sessionStorage.removeItem('pendingCoupon');
  localStorage.removeItem('pendingCart');
  localStorage.removeItem('pendingBuyer');
  localStorage.removeItem('pendingCoupon');

  card.innerHTML='<div class="icon ok">✓</div><h2>Ödeme Başarılı!</h2><p>Siparişiniz alındı. En kısa sürede kargoya verilecektir.</p><a class="btn" href="./">Ana Sayfaya Dön</a>';
})();
</script>
</body>
</html>
